name: Offline checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  financial-formulas:
    name: Financial formulas (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.5'
      - name: Install offline dependencies
        run: python -m pip install --disable-pip-version-check -r eval/requirements-offline.txt
      - name: Check production financial formulas
        run: python eval/run_eval.py --offline
      - name: Verify offline boundaries and failure propagation
        run: python -m unittest discover -s eval -p test_offline_runner.py -v
