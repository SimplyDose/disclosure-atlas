name: Offline checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  financial-formulas:
    name: Financial formulas (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.5'
      - name: Install offline dependencies
        run: python -m pip install --disable-pip-version-check -r eval/requirements-offline.txt
      - name: Check production financial formulas
        run: python eval/run_eval.py --offline
      - name: Verify offline boundaries and failure propagation
        run: python -m unittest discover -s eval -p test_offline_runner.py -v

  research-example:
    name: Paper example (shipped data)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.5'
      - name: Install example dependencies
        run: python -m pip install --disable-pip-version-check -r examples/requirements.txt
      - name: Check archived cohort, estimates and offline boundaries
        run: python -m unittest discover -s eval -p test_research_example.py -v
      - name: Check full testing family and singleton sensitivity
        run: python -m unittest discover -s eval -p test_screen_reproduction.py -v
      - name: Check featured-pair builder integrity
        run: python -m unittest discover -s eval -p test_featured_integrity.py -v

  frontend:
    name: Frontend scores and build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
